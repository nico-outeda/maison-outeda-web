<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Outeda · Bespoke software</title>
<meta name="description" content="Maison Outeda designs and builds bespoke software, made to measure for each client.">
<meta property="og:title" content="Maison Outeda · Bespoke software">
<meta property="og:description" content="Bespoke software, made to measure for each client.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://maisonouteda.com/">
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231E2A23'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23C2A46A' stroke-width='1.5'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' fill='%23EDE6D6' text-anchor='middle' letter-spacing='-1'%3EMO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EFE4;
    --ink: #1E2A23;
    --muted: #6A675A;
    --gold: #8C6F3A;
    --rule: #CDBD95;
    --frame: #D9CDB0;
    --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --text: "EB Garamond", Garamond, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111814;
      --ink: #ECE5D5;
      --muted: #A49E8C;
      --gold: #C4A66C;
      --rule: #5A5038;
      --frame: #2C3A31;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111814;
    --ink: #ECE5D5;
    --muted: #A49E8C;
    --gold: #C4A66C;
    --rule: #5A5038;
    --frame: #2C3A31;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Marco a doble filete, como una tarjeta impresa */
  .frame {
    position: fixed; inset: 16px;
    border: 1px solid var(--frame);
    pointer-events: none;
  }
  .frame::after {
    content: ""; position: absolute; inset: 5px;
    border: 1px solid var(--frame);
  }

  main {
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 56px 32px 40px;
  }
  .card {
    align-self: center; justify-self: center;
    max-width: 34rem;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }

  .est {
    font-family: var(--text);
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .crest { width: 112px; height: 112px; margin: 28px 0 30px; color: var(--gold); }
  .crest text { font-family: var(--display); fill: var(--ink); }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4.25rem);
    line-height: 1;
    letter-spacing: 0.04em;
  }
  .tagline {
    margin-top: 18px;
    font-size: 0.85rem;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold);
    padding-left: 0.36em; /* compensa el tracking para centrar */
  }

  .rule {
    display: flex; align-items: center; gap: 14px;
    width: 9rem; margin: 34px 0 30px; color: var(--rule);
  }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; }
  .rule span { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--gold); }

  .lede {
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(1.3rem, 3.6vw, 1.55rem);
    line-height: 1.45;
    max-width: 28rem;
  }

  .contact {
    margin-top: 40px;
    font-size: 0.8rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .contact a {
    display: inline-block;
    margin-top: 8px;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    transition: border-color .2s, color .2s;
  }
  .contact a:hover, .contact a:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
    padding: 0 8px;
  }
  .lang { display: flex; gap: 10px; align-items: center; }
  .lang button {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: 0; padding: 4px 2px; cursor: pointer;
    color: var(--muted);
  }
  .lang button[aria-pressed="true"] { color: var(--ink); border-bottom: 1px solid var(--gold); }
  .lang button:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }
  .lang .sep { opacity: .5; }

  @media (max-width: 520px) {
    body { font-size: 17px; }
    main { padding: 48px 20px 36px; }
    .frame { inset: 10px; }
    .crest { width: 92px; height: 92px; margin: 22px 0 24px; }
    .tagline { letter-spacing: 0.28em; padding-left: 0.28em; }
    footer { flex-direction: column-reverse; gap: 10px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .card > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .card > *:nth-child(2) { animation-delay: .08s; }
    .card > *:nth-child(3) { animation-delay: .16s; }
    .card > *:nth-child(4) { animation-delay: .22s; }
    .card > *:nth-child(5) { animation-delay: .28s; }
    .card > *:nth-child(6) { animation-delay: .34s; }
    .card > *:nth-child(7) { animation-delay: .40s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <main>
    <div class="card">
      <p class="est">Est. MMXXVI</p>

      <svg class="crest" viewBox="0 0 120 120" role="img" aria-label="Maison Outeda monogram">
        <circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="0.6"/>
        <text x="60" y="74" font-size="46" text-anchor="middle" letter-spacing="-3">MO</text>
        <path d="M44 88 H76" stroke="currentColor" stroke-width="0.8"/>
        <circle cx="60" cy="88" r="1.6" fill="currentColor"/>
      </svg>

      <h1>Maison Outeda</h1>
      <p class="tagline">Bespoke software</p>

      <div class="rule" aria-hidden="true"><span></span></div>

      <p class="lede" data-en="Software made to measure for each client. Few commissions, considered work, built to last."
                      data-es="Software hecho a medida para cada cliente. Pocos encargos, trabajo cuidado, hecho para durar.">
        Software made to measure for each client. Few commissions, considered work, built to last.
      </p>

      <p class="contact">
        <span data-en="Enquiries" data-es="Contacto">Enquiries</span><br>
        <a href="mailto:contact@maisonouteda.com">contact@maisonouteda.com</a>
      </p>
    </div>

    <footer>
      <span>© 2026 Maison Outeda</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <span class="sep" aria-hidden="true">·</span>
        <button type="button" data-lang="es" aria-pressed="false">Español</button>
      </div>
    </footer>
  </main>

<script>
  (function () {
    var buttons = document.querySelectorAll('.lang button');
    function apply(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        el.textContent = el.getAttribute('data-' + lang);
      });
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    }
    var saved = null;
    try { saved = localStorage.getItem('mo-lang'); } catch (e) {}
    var initial = saved || ((navigator.language || 'en').toLowerCase().indexOf('es') === 0 ? 'es' : 'en');
    apply(initial);
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        apply(b.dataset.lang);
        try { localStorage.setItem('mo-lang', b.dataset.lang); } catch (e) {}
      });
    });
  })();
</script>
</body>
</html>
